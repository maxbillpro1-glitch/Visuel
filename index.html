<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Générateur d'Affiche Pro</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librairie CDN pour la génération du QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Créateur d'Affiche</h1>
            <p>Importez votre photo, ajustez-la et téléchargez votre affiche HD.</p>
        </header>

        <main class="editor-section">
            <!-- Zone d'édition interactive -->
            <div class="canvas-wrapper" id="drop-zone">
                <canvas id="poster-canvas" width="1080" height="1350"></canvas>
                
                <!-- Overlay d'aide / Dropzone -->
                <div class="drop-overlay" id="drop-overlay">
                    <div class="icon">📷</div>
                    <p>Cliquez ou glissez-déposez votre photo ici</p>
                    <input type="file" id="image-input" accept="image/*" hidden>
                </div>
            </div>

            <!-- Panneau de contrôle -->
            <div class="controls-panel">
                <div class="action-buttons">
                    <button id="btn-change-photo" class="btn btn-secondary">Changer de photo</button>
                    <button id="btn-recenter" class="btn btn-secondary">Recentrer / Smart Crop</button>
                </div>

                <div class="zoom-control">
                    <label for="zoom-slider">Zoom :</label>
                    <input type="range" id="zoom-slider" min="0.5" max="3" step="0.01" value="1" disabled>
                </div>

                <div class="export-group">
                    <h3>Télécharger l'affiche HD</h3>
                    <div class="export-buttons">
                        <button class="btn btn-primary btn-export" data-scale="1">1080 x 1350 px</button>
                        <button class="btn btn-primary btn-export" data-scale="2">2160 x 2700 px (2K)</button>
                        <button class="btn btn-primary btn-export" data-scale="3">3240 x 4050 px (4K)</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Canvas invisible pour la génération du QR code -->
    <div id="qrcode-container" style="display: none;"></div>

    <script src="script.js"></script>
</body>
</html>
